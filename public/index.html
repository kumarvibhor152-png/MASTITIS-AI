<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MASTITIS AI — Precision Dairy Health & Mastitis Forecasting</title>
  <meta name="description" content="AI-based predictive modelling for early forecasting of bovine mastitis in dairy cattle. Smart India Hackathon 2024 Problem Statement 109.">
  <meta name="theme-color" content="#064e3b">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <!-- Top Farmer Header -->
  <header class="app-header">
    <div class="brand-section">
      <div class="brand-logo-icon" style="display:flex; align-items:center; justify-content:center; font-size:24px; line-height:1;">
        𓃔
      </div>
      <div>
        <div class="brand-title" id="headerAppName">MASTITIS AI</div>
        <div class="brand-subtitle" id="headerAppTagline">Precision Bovine Health Intelligence System</div>
      </div>
    </div>

    <div class="header-controls">
      <!-- Mode Toggle (Kisan vs Vet) -->
      <button class="mode-toggle-btn" id="modeToggleBtn" title="Switch between Kisan Simple Mode and Vet Pro Mode">
        <span>Kisan Mode</span>
      </button>

      <!-- Sunlight High Contrast Toggle for Barn Use -->
      <button class="sun-toggle-btn" id="sunToggleBtn" title="Toggle Outdoor Sunlight High Contrast Mode">
        
      </button>

      <!-- Language Selector (10 Indian Languages) -->
      <select class="lang-select" id="langSelect" aria-label="Select Language">
        <!-- Populated dynamically by app.js -->
      </select>
    </div>
  </header>

  <!-- App Layout Container -->
  <div class="app-container">
    <!-- Desktop Sidebar Navigation -->
    <aside class="desktop-nav" id="desktopNav">
      <!-- Populated dynamically by app.js -->
    </aside>

    <!-- Main Viewport Area -->
    <main class="main-viewport" id="mainViewport">
      <!-- Populated dynamically by app.js -->
      <div style="text-align:center; padding:50px;">
        <div style="font-size:2rem; animation: pulse-ring 1s infinite;"></div>
        <p style="margin-top:10px; color:#666;">Loading MASTITIS AI Dashboard...</p>
      </div>
    </main>
  </div>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav" id="mobileBottomNav">
    <!-- Populated dynamically by app.js -->
  </nav>

  <!-- Load Scripts -->
  <script src="/locales.js"></script>
  <script src="/app.js"></script>
</body>
</html>
