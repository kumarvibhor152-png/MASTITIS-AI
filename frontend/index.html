<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="description" content="MASTITIS AI — Precision Dairy Health & Bovine Mastitis Early Forecasting Platform" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MASTITIS AI" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>MASTITIS AI — Precision Dairy Health & Mastitis Forecasting</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('mastitrack-theme') || '{}');
        if (t && t.state && t.state.darkMode) {
          document.documentElement.classList.add('dark');
        }
        var lang = localStorage.getItem('mastitrack_lang');
        if (lang && lang !== 'en') {
          document.cookie = 'googtrans=/en/' + lang + '; path=/;';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden Google Translate Element Anchor -->
    <div id="google_translate_element" style="position: absolute; left: -9999px; top: -9999px; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none;"></div>
    <script type="text/javascript">
      window.googleTranslateElementInit = function () {
        try {
          if (window.google && window.google.translate && window.google.translate.TranslateElement) {
            new window.google.translate.TranslateElement(
              {
                pageLanguage: 'en',
                includedLanguages: 'en,hi,gu,mr,pa,ta,te,bn,kn,or',
                layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false,
              },
              'google_translate_element'
            );
          }
        } catch (e) {
          console.warn('Google Translate initialization:', e);
        }
      };
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
    <!-- Google Translate Banner & Layout Offset Suppressor -->
    <script type="text/javascript">
      (function () {
        function suppressGoogleTranslateBanner() {
          if (document.body && document.body.style.top && document.body.style.top !== '0px') {
            document.body.style.top = '0px';
          }
          if (document.documentElement && document.documentElement.style.top && document.documentElement.style.top !== '0px') {
            document.documentElement.style.top = '0px';
          }
          var frames = document.querySelectorAll(
            '.goog-te-banner-frame, iframe.skiptranslate, iframe[class*="VIpgJd"], [class*="VIpgJd"], #goog-gt-tt, .goog-te-balloon-frame, .goog-tooltip'
          );
          for (var i = 0; i < frames.length; i++) {
            frames[i].style.setProperty('display', 'none', 'important');
            frames[i].style.setProperty('visibility', 'hidden', 'important');
            frames[i].style.setProperty('height', '0px', 'important');
            frames[i].style.setProperty('width', '0px', 'important');
            frames[i].style.setProperty('opacity', '0', 'important');
          }
        }

        if (typeof MutationObserver !== 'undefined') {
          var obs = new MutationObserver(suppressGoogleTranslateBanner);
          obs.observe(document.documentElement, {
            attributes: true,
            childList: true,
            subtree: true,
            attributeFilter: ['style', 'class'],
          });
        }
        window.addEventListener('load', suppressGoogleTranslateBanner);
        document.addEventListener('DOMContentLoaded', suppressGoogleTranslateBanner);
        setInterval(suppressGoogleTranslateBanner, 300);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
